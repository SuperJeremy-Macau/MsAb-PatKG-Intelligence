services:
  - type: web
    name: bsab-patent-qa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run bsab_kg_qa_en/app/app_interactive.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: OPENAI_MODEL
        value: gpt-5.4
